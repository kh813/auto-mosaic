# Default configuration for auto-mosaic

# Detection target mode to optimize PC / Mac hardware load:
# - "faces": Detect and mosaic human faces only (minimal CPU/GPU/NPU load)
# - "plates": Detect and mosaic vehicle license plates only (minimal CPU/GPU/NPU load)
# - "both": Detect and mosaic both human faces and license plates
target: "faces"

# Face detection model settings
model:
  name: "scrfd_10g_bnkps.onnx"   # Options: scrfd_2.5g_bnkps.onnx, scrfd_10g_bnkps.onnx, scrfd_34g_gnkps.onnx
  conf_threshold: 0.5            # Detection confidence threshold (0.0 - 1.0)
  nms_threshold: 0.4             # Non-maximum suppression IoU threshold
  min_face_size: 15              # Minimum face bounding box size in pixels
  landmark_score_threshold: 0.3  # Landmark confidence filter

# License plate detection model settings
plate_model:
  name: "license-plate-finetune-v1n.onnx" # YOLOv11n ONNX model for license plates
  conf_threshold: 0.40           # License plate detection confidence threshold (0.0 - 1.0)
  nms_threshold: 0.45            # Non-maximum suppression IoU threshold
  min_plate_size: 12             # Minimum license plate size (short side in pixels)
  margin_x: 0.15                 # Horizontal expansion ratio for license plate bounding box
  margin_y: 0.15                 # Vertical expansion ratio for license plate bounding box
  shape: "rounded_rect"          # Options: "rounded_rect" (recommended for plates with soft rounded edges), "rect", or "ellipse"
  vehicle_model: "yolo11n.onnx"  # YOLOv11n vehicle validation model
  require_vehicle: true          # Strictly validate that license plate is located on a detected vehicle

# Tracking & temporal smoothing
tracking:
  iou_threshold: 0.25            # Strict spatial IoU threshold for matching tracklets
  max_missing_frames: 10         # Number of missing frames before track is dropped (at 30fps)
  padding_backward: 4            # Number of frames to extend blur backward safely (stationary hold)
  padding_forward: 8             # Number of frames to extend blur forward after face disappearance (at 30fps)
  auto_scale_by_fps: true        # Automatically scale padding & missing frames based on video FPS (e.g. 60/120/240fps)
  base_fps: 30.0                 # Reference FPS baseline for the padding frame settings

# Blur & mosaic effect settings
blur:
  type: "gaussian"               # Options: "gaussian" or "mosaic"
  shape: "ellipse"               # Options: "ellipse" (round) or "rect" (rectangular)
  strength: 51                   # Gaussian blur kernel size (odd integer, e.g. 51) or sigma
  mosaic_block_size: 28          # Mosaic block size in pixels (if type == "mosaic")
  margin_x: 0.50                 # Horizontal expansion ratio of bounding box (e.g. 0.50 = 50% on each side)
  margin_y: 0.50                 # Vertical expansion ratio of bounding box

# False positive reduction filters
filters:
  # Animal vs Human classifier
  animal_filter:
    enabled: true
    human_prob_threshold: 0.5
  
  # Skin color check (YCbCr chrominance check to eliminate statues/bronze)
  skin_color_filter:
    enabled: true
    min_skin_ratio: 0.15         # Minimum percentage of pixels within skin tone
  
  # Illustration / Drawing / Anime face filter (Eliminates flat-shaded cartoon/drawn faces)
  illustration_filter:
    enabled: true
    flatness_threshold: 0.65
    min_crop_size: 16

  # Static photo / advertisement filter (Composite conditions, default OFF)
  static_photo_filter:
    enabled: false
    min_static_frames: 30
    motion_similarity_threshold: 0.95
    texture_diff_threshold: 0.05
  
  # Fixed exclusion masks (normalized coordinates [x1, y1, x2, y2] between 0.0 and 1.0)
  exclusion_masks: []

# Output & encoding settings
output:
  codec: "auto"                  # Options: "auto" (match input video codec), "hevc" (libx265), or "h264" (libx264)
  crf: 23                        # Constant Rate Factor (23 recommended for optimal balance and ~50% size reduction, 18 for archival quality)
  preset: "medium"               # Encoder preset (ultrafast, fast, medium, slow)
  bit_depth: "auto"              # Options: "auto" (match input), "8bit" (force 8-bit for size & compatibility), "10bit"
  preserve_color_tags: true      # Preserve BT.2020 / BT.709 color tags and ranges
  output_dir: ""                 # Default is same directory as input file
  filename_suffix: "_blurred"    # Output suffix before extension (e.g. foo_blurred.mp4)
  append_params_to_filename: false # Append blur and CRF parameters to output filename (e.g. foo_blurred_(G51-M50-CRF23).mp4)

